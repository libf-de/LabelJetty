<div class="update-banner" role="status">
  <span class="update-icon" aria-hidden="true">⬆</span>
  <span class="update-text">
    Update verfügbar: <strong>{{ update.latest }}</strong>
    <span class="update-current">(installiert: {{ update.current }})</span>
    {% if update.release_url %}
    — <a href="{{ update.release_url }}" target="_blank" rel="noopener">Versionshinweise</a>
    {% endif %}
    ·
    <a href="https://github.com/{{ repo }}/blob/main/docs/updating.md" target="_blank" rel="noopener">Anleitung zum Aktualisieren</a>
  </span>
</div>
