<div class="preview-wrap">
  {% if error %}
    <div class="msg err">{{ error }}</div>
  {% elif image %}
    <img src="{{ image }}" alt="Etikettenvorschau">
    {% if homebox %}
    <div class="hint">Etikett von Homebox – wird unverändert gedruckt</div>
    {% else %}
    <div class="hint">{{ width_mm }}×{{ height_mm }} mm · so wird gedruckt (1 Bit, gerastert)</div>
    {% endif %}
  {% else %}
    Keine Vorschau vorhanden.
  {% endif %}
</div>
